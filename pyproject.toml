[project]
name = "personal-assistant"
version = "0.1.0"
description = "Personal Assistant Telegram bot with Claude API integration"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "mcp>=0.1.0",
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
# bot/ modules import each other as top-level modules (e.g. `from agent import ...`).
pythonpath = [".", "bot"]
testpaths = ["tests"]
